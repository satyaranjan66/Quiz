<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satya Quiz Game - 50 Levels</title>
    <style>
        :root { --gold: #ffcc00; --blue: #00d4ff; --dark: #050520; }
        
        body {
            background: radial-gradient(circle, #1a1a4d, #000);
            color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }

        /* --- Welcome Screen Pop-up --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        .welcome-card {
            border: 2px solid var(--gold); padding: 30px; border-radius: 20px;
            background: #111; box-shadow: 0 0 40px var(--blue); max-width: 400px;
        }

        h1 { color: var(--gold); margin-top: 0; text-shadow: 0 0 15px var(--gold); }

        .rules-box {
            text-align: left; background: #222; padding: 15px; 
            border-radius: 10px; margin: 20px 0; font-size: 14px; line-height: 1.6;
        }

        .start-btn {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: black; border: none; padding: 15px 45px;
            font-size: 18px; font-weight: bold; border-radius: 50px;
            cursor: pointer; transition: 0.3s;
        }

        .start-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--gold); }

        .insta-btn {
            margin-top: 25px; display: inline-block; color: #e1306c;
            text-decoration: none; font-weight: bold; font-size: 15px;
        }

        /* --- Main Game Layout --- */
        #game-container {
            width: 92%; max-width: 450px; background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--gold); border-radius: 20px; padding: 20px;
            box-shadow: 0 0 30px var(--blue); text-align: center;
            display: none; /* Initially Hidden */
        }

        #timer { font-size: 32px; color: #ff4444; font-weight: bold; margin-bottom: 10px; }

        .status-bar { display: flex; justify-content: space-between; color: var(--gold); margin-bottom: 15px; font-weight: bold; }

        .question-display {
            background: #111; padding: 25px; border-radius: 15px; border: 1px solid var(--blue);
            margin-bottom: 25px; min-height: 90px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }

        .options-grid { display: grid; gap: 15px; }

        .opt-btn {
            background: transparent; color: white; border: 1.5px solid var(--gold);
            padding: 15px; border-radius: 50px; cursor: pointer; transition: 0.3s;
            text-align: left; padding-left: 35px; font-size: 1rem;
        }

        .opt-btn:hover { background: rgba(255, 204, 0, 0.2); }
        .correct { background: #28a745 !important; border-color: #28a745; }
        .wrong { background: #dc3545 !important; border-color: #dc3545; }

        .footer-progress { margin-top: 20px; font-size: 12px; color: #777; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>WELCOME TO<br>SATYA QUIZ GAME</h1>
            <div class="rules-box">
                <b>Kaise Khele (How to Play):</b><br>
                • Isme total 50 levels hain.<br>
                • Har level mein 10 sawal honge.<br>
                • Har sawal ke liye 60 seconds milenge.<br>
                • Galat jawab pe game turant khatam!
            </div>
            <button class="start-btn" onclick="initGame()">CHALO SHURU KAREIN</button><br>
            <a href="https://www.instagram.com/__crazy__king__satya__" target="_blank" class="insta-btn">📸 Feedback on Instagram</a>
        </div>
    </div>

    <div id="game-container">
        <div id="timer">60</div>
        <div class="status-bar">
            <span id="lvl-txt">LEVEL: 1/50</span>
            <span id="prize-txt">₹0</span>
        </div>

        <div class="question-display">
            <div id="question-text">Loading...</div>
        </div>

        <div class="options-grid" id="options-box"></div>

        <div class="footer-progress">
            Current Level Progress: <span id="q-count">1</span>/10
        </div>
    </div>

    <script>
        // --- Questions Database (Add your 500 questions here) ---
        const questionBank = [
            { q: "JavaScript ka use kahan hota hai?", a: "Web Development", opts: ["Web Development", "Car Engine", "Medicine", "Agriculture"] },
            { q: "Bharat ki Rajdhani kahan hai?", a: "New Delhi", opts: ["Mumbai", "Patna", "New Delhi", "Kolkata"] },
            { q: "Computer ka Dimag kise kehte hain?", a: "CPU", opts: ["RAM", "Monitor", "CPU", "Hard Drive"] },
            { q: "HTML ka full form kya hai?", a: "HyperText Markup Language", opts: ["HyperText Markup Language", "HighText Machine Language", "Hyperlink Text", "None"] },
            { q: "Mobile ka avishkar kisne kiya?", a: "Martin Cooper", opts: ["Graham Bell", "Martin Cooper", "Thomas Edison", "Newton"] },
            // Example for Level 2 (Add more to reach 500)
            { q: "Python file ka extension kya hota hai?", a: ".py", opts: [".java", ".html", ".py", ".cpp"] }
        ];

        let level = 1, qNumber = 0, score = 0, currentIndex = 0;
        let shuffledList = [], timeLeft = 60, timer;

        function initGame() {
            document.getElementById("welcome-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            // Pure database ko shuffle (mix) kar dena
            shuffledList = questionBank.sort(() => Math.random() - 0.5);
            loadNext();
        }

        function loadNext() {
            if (currentIndex >= shuffledList.length) {
                alert("MUBARAK HO! Aapne saare 50 Levels jeet liye!");
                location.reload(); return;
            }

            resetTimer();
            const data = shuffledList[currentIndex];
            document.getElementById("question-text").innerText = data.q;
            document.getElementById("lvl-txt").innerText = `LEVEL: ${level}/50`;
            document.getElementById("prize-txt").innerText = `₹${score.toLocaleString()}`;
            document.getElementById("q-count").innerText = qNumber + 1;

            const box = document.getElementById("options-box");
            box.innerHTML = "";
            data.opts.forEach(opt => {
                const b = document.createElement("button");
                b.className = "opt-btn";
                b.innerText = opt;
                b.onclick = () => check(b, opt, data.a);
                box.appendChild(b);
            });
        }

        function check(btn, selected, correct) {
            clearInterval(timer);
            const btns = document.querySelectorAll(".opt-btn");
            btns.forEach(el => el.style.pointerEvents = "none");

            if (selected === correct) {
                btn.classList.add("correct");
                score += (level * 5000);
                qNumber++; currentIndex++;

                if (qNumber >= 10) {
                    level++; qNumber = 0;
                    setTimeout(() => alert(`🎉 LEVEL UP! Ab aap Level ${level} par hain.`), 200);
                }
                setTimeout(loadNext, 1200);
            } else {
                btn.classList.add("wrong");
                setTimeout(() => {
                    alert(`❌ GALAT JAWAB!\n\nSahi jawab tha: "${correct}"\n\nAapne jite: ₹${score}`);
                    location.reload();
                }, 500);
            }
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 60;
            document.getElementById("timer").innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert("⏰ TIME OUT! Aapka samay samapt ho gaya.");
                    location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
